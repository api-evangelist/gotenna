notes: >-
  goTenna ships a first-party Radio SDK (RSDK) for radio connection management
  across Android, iOS, and Linux JVM. The SDK is not a web/REST API; it is a
  native binary distributed from goTenna's Artifactory (gotenna.jfrog.io) and,
  for iOS, as a Swift Package. Access requires an SDK app token obtained from
  goTenna (see https://gotennapro.com/pages/contact-us). Current version 3.4.22.
