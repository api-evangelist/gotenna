aid: gotenna
name: GoTenna
description: >-
  goTenna is a mobile mesh networking company that builds off-grid, long-range
  communication hardware and software. Its consumer goTenna Mesh and professional
  goTenna Pro devices pair with smartphones over Bluetooth to relay text messages,
  GPS locations, and data across a decentralized VHF/UHF radio mesh with no cell
  towers, wifi, or satellite dependency. The Aspen Grove mesh protocol stack and
  the Radio SDK (RSDK) let third-party developers embed goTenna radio connectivity
  into Android, iOS, and Linux JVM applications for public safety, defense, and
  outdoor use. goTenna exposes no public REST/web API; developer integration is via
  the native RSDK, which requires an SDK app token obtained from goTenna.
